# pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "configmaster"
version = "0.1.0"
description = "A configuration management suite with multiple file formats, entries typing (with a schema), nested configs etc."
readme = "README.md"
authors = [{ name = "ParisNeo", email = "parisneoai@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "ascii_colors>0.10.0",
    "pyyaml>=6.0", # Add for YAML support later
    "toml>=0.10.2", # Add for TOML support later
    "cryptography>=3.4", # Add for encryption later
]

[project.urls]
Homepage = "https://github.com/ParisNeo/ConfigMaster"
Repository = "https://github.com/ParisNeo/ConfigMaster.git"
Documentation = "https://parisneo.github.io/ConfigMaster/" # Placeholder

[tool.setuptools.packages.find]
where = ["."]
include = ["configmaster*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
configmaster = ["py.typed"] # For type hinting support